name: Temporary taxonomy lookup

on:
  push:
    branches:
      - lot-logic-public-site

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 25
      - name: Inspect Audi taxonomy
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS 'https://deploy-preview-3--mmav.netlify.app/api/marketcheck/taxonomy-diagnostic?make=Audi&year=2012')"
          compact="$(printf '%s' "$body" | jq -c .)"
          printf 'TAXONOMY_RESULT=%s\n' "$compact" >&2
          exit 1
