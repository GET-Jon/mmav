name: Temporary direct-model search validation

on:
  push:
    branches:
      - lot-logic-public-site

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save tsx
      - name: Run generation regressions
        run: npx tsx -e 'import { assertVehicleGenerationRegressionCases } from "./lib/vehicle-generations/generation-regression.ts"; console.log(assertVehicleGenerationRegressionCases());'
      - name: Run model discovery regressions
        run: npx tsx -e 'import { assertMarketCheckModelDiscoveryRegressionCases } from "./lib/marketcheck/model-discovery-regression.ts"; console.log(assertMarketCheckModelDiscoveryRegressionCases());'
      - name: Run vehicle equivalence regressions
        run: npx tsx -e 'import { assertVehicleEquivalenceRegressionCases } from "./lib/marketcheck/vehicle-equivalence-regression.ts"; console.log(assertVehicleEquivalenceRegressionCases());'
      - run: npm run build
      - name: Wait for Netlify preview
        run: sleep 75
      - name: Run one controlled TTS diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L -X POST 'https://deploy-preview-3--mmav.netlify.app/api/marketcheck/search'             -H 'content-type: application/json'             --data '{
              "year": 2012,
              "make": "Audi",
              "model": "TTS",
              "trim": "2.0T quattro Premium Plus",
              "fuelType": "gasoline",
              "targetMileage": 80000,
              "includeMarketLiquidity": false,
              "debug": true,
              "maxApiCallsPerSearch": 3,
              "regions": [
                {"market":"Los Angeles","zip":"90012","order":1,"enabled":true},
                {"market":"New York","zip":"10001","order":2,"enabled":true}
              ]
            }' > /tmp/tts.json
          echo '--- TTS CONTROLLED DIAGNOSTIC ---'
          jq '{
            error,
            stopReason,
            usableCompCount,
            apiCallsMade: .apiUsage.apiCallsMade,
            attempts: [.apiUsage.searchLog[]? | {
              attemptName,
              market,
              requestedModel: .requested.model,
              requestedYear: .requested.year,
              numFound,
              listingCount,
              usableComps
            }],
            generationWidening: .apiUsage.generationWidening,
            filterDiagnostics: .apiUsage.filterDiagnostics,
            finalComps: [.comps[]? | {
              year, model, trim, equivalenceTier, qualityScore,
              heading: .marketCheckDetails.heading
            }]
          }' /tmp/tts.json
