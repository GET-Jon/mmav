name: V15 + V16 Integration Build

on:
  push:
    branches:
      - v15-v16-integration
  pull_request:
    branches:
      - v15-inventory-workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
