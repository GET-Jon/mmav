name: Expand comp markets

on:
  push:
    branches:
      - lot-logic-public-site

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lot-logic-public-site
          fetch-depth: 0
      - run: python .github/scripts/expand_comp_markets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/evaluation/evaluation-workspace.tsx
          if git diff --cached --quiet; then
            echo "No comp expansion changes to commit."
            exit 0
          fi
          git commit -m "Expand comp market suggestions outward"
          git push origin HEAD:lot-logic-public-site
