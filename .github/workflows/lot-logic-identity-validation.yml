name: Lot Logic identity validation

on:
  push:
    branches:
      - lot-logic-public-site

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run vehicle identity regression suite
        run: npx --yes tsx@4.20.5 -e "import { assertVehicleEquivalenceRegressionCases } from './lib/marketcheck/vehicle-equivalence-regression.ts'; console.log(assertVehicleEquivalenceRegressionCases());"
      - run: npm run build
