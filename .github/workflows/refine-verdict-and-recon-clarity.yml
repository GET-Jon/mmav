name: Refine verdict and recon clarity

on:
  push:
    branches:
      - lot-logic-public-site

permissions:
  contents: write

jobs:
  refine-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lot-logic-public-site
          fetch-depth: 0

      - name: Apply clarity refinement
        run: python .github/scripts/refine_verdict_and_recon_clarity.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/evaluation/evaluation-workspace.tsx
          if git diff --cached --quiet; then
            echo "No evaluator changes to commit."
            exit 0
          fi
          git commit -m "Clarify verdict economics and recon reserves"
          git push origin HEAD:lot-logic-public-site
