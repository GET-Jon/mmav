name: Temporary TTS response diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - lot-logic-public-site

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for preview routing
        run: sleep 8
      - name: Query deployed TTS search
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST 'https://deploy-preview-3--mmav.netlify.app/api/marketcheck/search'             -H 'content-type: application/json'             --data '{
              "year": 2012,
              "make": "Audi",
              "model": "TTS",
              "trim": "2.0T quattro Premium Plus",
              "fuelType": "gasoline",
              "mileage": 80000,
              "targetMileage": 80000,
              "includeMarketLiquidity": false,
              "debug": true,
              "maxApiCallsPerSearch": 1,
              "regions": [{"market":"Los Angeles","zip":"90012","order":1,"enabled":true}]
            }' > /tmp/tts.json
          jq '{
            error,
            stopReason,
            usableCompCount,
            search,
            apiUsage: {
              apiCallsMade: .apiUsage.apiCallsMade,
              stopReason: .apiUsage.stopReason,
              generationWidening: .apiUsage.generationWidening,
              filterDiagnostics: .apiUsage.filterDiagnostics,
              searchLog: .apiUsage.searchLog
            },
            debug: .debug,
            comps: [.comps[]? | {
              year, model, trim, qualityScore, equivalenceTier, equivalenceReasons,
              heading: .marketCheckDetails.heading,
              raw_model: .marketCheckDetails.raw.build.model,
              raw_trim: .marketCheckDetails.raw.build.trim,
              raw_version: .marketCheckDetails.raw.build.version,
              top_version: .marketCheckDetails.raw.version,
              engine: .marketCheckDetails.engine
            }]
          }' /tmp/tts.json
