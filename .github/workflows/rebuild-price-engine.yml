name: Rebuild price engine

on:
  push:
    branches:
      - lot-logic-public-site

permissions:
  contents: write

jobs:
  rebuild-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lot-logic-public-site
          fetch-depth: 0
      - run: python .github/scripts/rebuild_price_engine.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/valuation.ts types/evaluation.ts components/evaluation/evaluation-workspace.tsx
          if git diff --cached --quiet; then
            echo "No price engine changes to commit."
            exit 0
          fi
          git commit -m "Rebuild desired profit and economics scoring"
          git push origin HEAD:lot-logic-public-site
